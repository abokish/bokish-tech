<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>הדף לא נמצא | בוקיש-טק</title>
<meta name="description" content="בוקיש-טק – בית תוכנה משפחתי בערבה. אתרים, חנויות אונליין ומערכות ליישובים, לעסקים קטנים ולמחקר החקלאי.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&family=Assistant:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<meta property="og:title" content="בוקיש-טק – בית תוכנה משפחתי בערבה">
<meta property="og:description" content="אתרים, חנויות אונליין ומערכות ליישובים, לעסקים קטנים ולמחקר החקלאי.">
<meta property="og:image" content="https://bokish-tech.pages.dev/assets/og.png">
<meta property="og:locale" content="he_IL">
<meta name="theme-color" content="#fdf7f1">
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<style>
  /* Layout: ערוץ אחד צר וחם, כמו דף מכתב – לוגו ה-B מוביל, פסי "אדמה" בצבעי הלוגו מפרידים בין חלקים */
  :root {
    --bg: #fdf7f1;          /* חול בהיר עם נטייה לאפרסק */
    --surface: #ffffff;
    --ink: #4a2f1b;         /* החום של הכיתוב בלוגו */
    --ink-soft: #7a5d47;
    --peach: #f7b78c;       /* החלק העליון של ה-B */
    --heart: #d9622e;       /* הלב */
    --ochre: #c98a3a;       /* האדמה */
    --olive: #5f6a3c;       /* העלה */
    --line: #ecd9c6;
    --f-display: 'Rubik', 'Assistant', system-ui, sans-serif;
    --f-body: 'Assistant', 'Rubik', system-ui, sans-serif;
    --f-code: 'IBM Plex Mono', ui-monospace, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #201710; --surface: #2b2017; --ink: #f6e8da; --ink-soft: #cdb6a1;
      --peach: #f7b78c; --heart: #f08a55; --ochre: #d9a052; --olive: #a9b77c; --line: #3d2f23;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #201710; --surface: #2b2017; --ink: #f6e8da; --ink-soft: #cdb6a1;
    --peach: #f7b78c; --heart: #f08a55; --ochre: #d9a052; --olive: #a9b77c; --line: #3d2f23;
    color-scheme: dark;
  }

  body {
    margin: 0;
    background: var(--bg); color: var(--ink);
    font-family: var(--f-body); font-size: 18px; line-height: 1.65;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .wrap { max-width: 760px; margin-inline: auto; }
  h1, h2, h3 { font-family: var(--f-display); line-height: 1.2; text-wrap: balance; margin: 0; }
  h2 { font-size: clamp(1.5rem, 1.2rem + 1.2vw, 2rem); font-weight: 800; }
  h3 { font-size: 1.15rem; font-weight: 700; }
  p { margin: 0; }
  a { color: var(--heart); text-underline-offset: 3px; }
  a:focus-visible, button:focus-visible { outline: 3px solid var(--olive); outline-offset: 3px; border-radius: 6px; }
  section { padding-block: 3rem; display: grid; gap: 1.4rem; }
  .lead { font-size: 1.2rem; color: var(--ink-soft); max-width: 60ch; }

  /* פס "אדמה" – שלוש השכבות של ה-B */
  .strata { height: 10px; border-radius: 999px; background: linear-gradient(to left, var(--peach) 0 34%, var(--ochre) 34% 72%, var(--olive) 72% 100%); opacity: .9; }

  /* פתיח */
  .hero { padding-block: 3.5rem 2.5rem; display: grid; gap: 1.6rem; }
  .brand { display: flex; align-items: center; gap: 1.1rem; }
  .brand img { width: 74px; height: auto; flex: none; }
  .brand h1 { font-size: clamp(2.4rem, 1.8rem + 3vw, 3.6rem); font-weight: 800; letter-spacing: -.01em; }
  .brand .en { display: block; font-family: var(--f-code); font-size: .85rem; color: var(--ochre); letter-spacing: .08em; margin-top: .2rem; }
  .tagline { font-family: var(--f-display); font-weight: 500; font-size: 1.25rem; color: var(--olive); }
  .thesis { font-family: var(--f-display); font-weight: 700; font-size: clamp(1.6rem, 1.3rem + 1.6vw, 2.3rem); line-height: 1.3; max-width: 22ch; text-wrap: balance; }
  .thesis em { font-style: normal; color: var(--heart); }
  .bits { font-family: var(--f-code); color: var(--ochre); font-size: .9rem; direction: ltr; text-align: right; letter-spacing: .2em; }

  /* מה אנחנו בונים */
  .services { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
  .service { background: var(--surface); padding: 1.3rem 1.4rem; display: grid; gap: .45rem; align-content: start; min-width: 0; }
  .service p { color: var(--ink-soft); font-size: 1rem; }
  .service .k { font-family: var(--f-code); font-size: .78rem; color: var(--olive); letter-spacing: .06em; direction: ltr; text-align: right; }

  /* עבודה לדוגמה */
  .case { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 1.6rem; display: grid; gap: 1rem; }
  .case-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: .4rem 1rem; }
  .status { font-size: .85rem; font-weight: 700; color: var(--olive); border: 1.5px solid var(--olive); border-radius: 999px; padding: .05rem .7rem; }
  .chips { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: .45rem; }
  .chips li { font-size: .95rem; background: color-mix(in srgb, var(--peach) 28%, var(--surface)); border-radius: 999px; padding: .2rem .8rem; }
  .case-link { font-weight: 700; justify-self: start; }

  /* איך עובדים – תהליך אמיתי, ולכן ממוספר */
  .steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 1rem; counter-reset: s; }
  .steps li { display: grid; grid-template-columns: 2.6rem 1fr; gap: .2rem 1rem; counter-increment: s; }
  .steps li::before { content: counter(s); grid-row: span 2; width: 2.6rem; height: 2.6rem; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; color: #fff; background: var(--ochre); }
  .steps li:nth-child(1)::before { background: var(--heart); }
  .steps li:nth-child(4)::before { background: var(--olive); }
  .steps p { color: var(--ink-soft); font-size: 1rem; }

  /* עקרונות */
  .principles { display: grid; gap: 1rem 1.6rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); }
  .principles div { display: grid; gap: .3rem; min-width: 0; }
  .principles p { color: var(--ink-soft); font-size: 1rem; }

  /* צרו קשר */
  .contact { background: var(--ink); color: var(--bg); border-radius: 20px; padding: 2rem 1.6rem; display: grid; gap: 1rem; }
  .contact h2 { color: var(--bg); }
  .contact p { color: color-mix(in srgb, var(--bg) 82%, transparent); }


  .ways { list-style: none; margin: .4rem 0 0; padding: 0; display: grid; gap: .9rem; }
  .ways li { display: grid; gap: .25rem; }
  .ways .label { font-size: .9rem; color: var(--peach); font-weight: 700; }
  .ways .val { font-family: var(--f-display); font-weight: 700; font-size: 1.45rem; justify-self: start; user-select: all; }
  .acts { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .2rem; }
  .btn { font: inherit; font-weight: 700; font-size: .95rem; cursor: pointer; text-decoration: none; border-radius: 999px; padding: .45rem 1.1rem; border: 2px solid var(--peach); background: var(--peach); color: #3a2414; }
  .btn.ghost { background: transparent; color: var(--peach); }
  .btn:focus-visible { outline-color: var(--peach); }
  .case + .case { margin-top: .2rem; }
  footer { padding-block: 2rem 3rem; color: var(--ink-soft); font-size: .9rem; display: flex; flex-wrap: wrap; justify-content: space-between; gap: .5rem 1rem; }

  @media (prefers-reduced-motion: no-preference) {
    .hero > * { animation: rise .6s ease both; }
    .hero > :nth-child(2) { animation-delay: .08s; }
    .hero > :nth-child(3) { animation-delay: .16s; }
    @keyframes rise { from { transform: translateY(8px); } to { transform: none; } }
  }
</style>
</head>
<body>


<div class="wrap">
  <header class="hero">
    <div class="brand">
      <img src="/assets/mark.png" alt="" width="74" height="99">
      <div>
        <h1>בוקיש-טק</h1>
        <span class="en" lang="en">BOKISH-TECH</span>
      </div>
<script>
  for (const b of document.querySelectorAll('[data-copy]')) {
    b.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = 'הועתק ✓'; }
      catch { const r = document.createRange(); r.selectNodeContents(b.closest('li').querySelector('.val')); getSelection().removeAllRanges(); getSelection().addRange(r); b.textContent = 'מסומן – אפשר להעתיק'; }
      setTimeout(() => { b.textContent = 'העתקה'; }, 2500);
    });
  }
</script>
    </div>
    <p class="tagline">בית תוכנה משפחתי בערבה</p>
    <p class="thesis">תוכנה שנבנית כאן, בערבה, <em>לאנשים שאנחנו מכירים.</em></p>
    <p class="lead">אנחנו בונים אתרים, חנויות ומערכות ליישובים, לעסקים קטנים ולמחקר החקלאי: בעברית, נגישים, וכאלה שאפשר להחזיק בלי עלות חודשית גבוהה.</p>
    <div class="strata" role="presentation"></div>
  </header>

  <main><section><h2>הדף לא נמצא</h2><p><a href="/">לדף הבית של בוקיש-טק</a></p></section></main>
</div>
</body>
</html>
