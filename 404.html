<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>הדף לא נמצא | בוקיש-טק</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#fdf7f1">
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&family=Assistant:wght@400;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  /* דף 404 קצר: מסך אחד, רובוט עצוב בצבעי הלוגו במרכז */
  :root {
    --bg: #fdf7f1; --surface: #ffffff; --ink: #4a2f1b; --ink-soft: #7a5d47;
    --peach: #f7b78c; --heart: #d9622e; --ochre: #c98a3a; --olive: #5f6a3c; --line: #ecd9c6;
    --robot-face: #fff6ee;
    --on-heart: #ffffff;
    --f-display: 'Rubik', 'Assistant', system-ui, sans-serif;
    --f-body: 'Assistant', 'Rubik', system-ui, sans-serif;
    --f-code: 'IBM Plex Mono', ui-monospace, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #201710; --surface: #2b2017; --ink: #f6e8da; --ink-soft: #cdb6a1;
      --heart: #f08a55; --ochre: #d9a052; --olive: #a9b77c; --line: #3d2f23; --robot-face: #3a2a1d; --on-heart: #201710;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #201710; --surface: #2b2017; --ink: #f6e8da; --ink-soft: #cdb6a1;
    --heart: #f08a55; --ochre: #d9a052; --olive: #a9b77c; --line: #3d2f23; --robot-face: #3a2a1d; --on-heart: #201710;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--f-body); font-size: 18px; line-height: 1.6;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: grid; grid-template-rows: auto 1fr;
  }
  .top { max-width: 760px; width: 100%; margin-inline: auto; padding-block: 1.2rem; }
  .brand { display: inline-flex; align-items: center; gap: .55rem; text-decoration: none; color: var(--ink); font-family: var(--f-display); font-weight: 800; font-size: 1.25rem; }
  .brand img { width: 28px; height: auto; }
  main { display: grid; place-items: center; text-align: center; padding-block: 1rem 3rem; }
  .card { display: grid; justify-items: center; gap: .9rem; max-width: 30rem; }
  .robot { width: min(210px, 52vw); height: auto; }
  .code { font-family: var(--f-code); font-weight: 600; font-size: clamp(2.6rem, 2rem + 3vw, 3.6rem); letter-spacing: .12em; color: var(--ochre); line-height: 1; direction: ltr; }
  h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(1.6rem, 1.3rem + 1.4vw, 2.1rem); margin: 0; text-wrap: balance; }
  p { margin: 0; color: var(--ink-soft); }
  .acts { display: flex; flex-wrap: wrap; justify-content: center; gap: .6rem; margin-top: .4rem; }
  .btn { font: inherit; font-weight: 700; text-decoration: none; border-radius: 999px; padding: .55rem 1.3rem; border: 2px solid var(--heart); }
  .btn.primary { background: var(--heart); color: var(--on-heart); }
  .btn.ghost { color: var(--heart); }
  a:focus-visible { outline: 3px solid var(--olive); outline-offset: 3px; }
  .strata { width: 9rem; height: 8px; border-radius: 999px; background: linear-gradient(to left, var(--peach) 0 34%, var(--ochre) 34% 72%, var(--olive) 72% 100%); }

  @media (prefers-reduced-motion: no-preference) {
    .antenna { transform-origin: 100px 46px; animation: droop 3.2s ease-in-out infinite; }
    .tear { animation: tear 3.2s ease-in infinite; }
    @keyframes droop { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(10deg); } }
    @keyframes tear { 0%, 35% { transform: translateY(0); opacity: 0; } 45% { opacity: 1; } 90% { transform: translateY(26px); opacity: 0; } 100% { opacity: 0; } }
  }
</style>
</head>
<body>
  <header class="top">
    <a class="brand" href="/"><img src="/assets/mark.png" alt="" width="28" height="37">בוקיש-טק</a>
  </header>
  <main>
    <div class="card">
      <!-- רובוט עצוב בצבעי הלוגו: ראש אפרסק, גוף אוכרה, עלה ירוק על האנטנה ולב על החזה -->
      <svg class="robot" viewBox="0 0 200 230" role="img" aria-label="רובוט קטן ועצוב">
        <ellipse cx="100" cy="222" rx="62" ry="6" fill="var(--line)"/>
        <g class="antenna">
          <line x1="100" y1="46" x2="100" y2="20" stroke="var(--ochre)" stroke-width="5" stroke-linecap="round"/>
          <path d="M100 20 C 88 8, 112 2, 118 10 C 114 20, 104 22, 100 20 Z" fill="var(--olive)"/>
        </g>
        <!-- ראש -->
        <rect x="42" y="44" width="116" height="88" rx="30" fill="var(--peach)"/>
        <rect x="56" y="58" width="88" height="60" rx="20" fill="var(--robot-face)"/>
        <!-- עיניים עצובות -->
        <path d="M70 80 L 88 74" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>
        <path d="M130 80 L 112 74" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>
        <circle cx="80" cy="90" r="6" fill="var(--ink)"/>
        <circle cx="120" cy="90" r="6" fill="var(--ink)"/>
        <!-- פה עצוב -->
        <path d="M86 108 Q 100 98, 114 108" fill="none" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>
        <!-- דמעה -->
        <path class="tear" d="M124 99 C 120 106, 120 110, 124 111 C 128 110, 128 106, 124 99 Z" fill="#6fa8d6"/>
        <!-- אוזניים -->
        <rect x="32" y="74" width="12" height="28" rx="6" fill="var(--ochre)"/>
        <rect x="156" y="74" width="12" height="28" rx="6" fill="var(--ochre)"/>
        <!-- צוואר וגוף -->
        <rect x="88" y="132" width="24" height="10" rx="4" fill="var(--ochre)"/>
        <rect x="56" y="140" width="88" height="70" rx="22" fill="var(--ochre)"/>
        <!-- לב על החזה (סדוק) -->
        <path d="M100 190 C 74 172, 80 152, 96 158 C 98 159, 100 162, 100 162 C 100 162, 102 159, 104 158 C 120 152, 126 172, 100 190 Z" fill="var(--heart)"/>
        <path d="M100 163 L 96 172 L 103 178 L 99 188" fill="none" stroke="var(--robot-face)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
        <!-- ידיים מורדות -->
        <path d="M58 158 C 42 170, 40 190, 46 200" fill="none" stroke="var(--ochre)" stroke-width="10" stroke-linecap="round"/>
        <path d="M142 158 C 158 170, 160 190, 154 200" fill="none" stroke="var(--ochre)" stroke-width="10" stroke-linecap="round"/>
        <!-- רגליים -->
        <rect x="72" y="206" width="20" height="14" rx="6" fill="var(--olive)"/>
        <rect x="108" y="206" width="20" height="14" rx="6" fill="var(--olive)"/>
      </svg>
      <div class="code" aria-hidden="true">404</div>
      <h1>הדף לא נמצא</h1>
      <p>אולי הקישור השתנה, או שנפלה טעות בכתובת. הרובוט שלנו כבר מצטער על זה.</p>
      <div class="acts">
        <a class="btn primary" href="/">לדף הבית</a>
        <a class="btn ghost" href="https://wa.me/972523666260" target="_blank" rel="noopener">שליחת הודעה בווטסאפ</a>
      </div>
      <div class="strata" role="presentation"></div>
    </div>
  </main>
</body>
</html>
